name: release-freebsd

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选：发布用 tag（例如 v1.2.3-freebsd.1）。留空则只产出 artifact，不发 Release"
        required: false
        type: string
  push:
    tags:
      - "v*-freebsd*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOOS: freebsd
  GOARCH: amd64
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          version=""

          # 1) tag 触发：直接用 tag
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          # 2) workflow_dispatch 且传了 release_tag：用输入值
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            version="${{ github.event.inputs.release_tag }}"
          fi

          # 3) 兜底：从 git 获取可读版本
          if [[ -z "$version" ]]; then
            version="$(git describe --tags --always 2>/dev/null || true)"
          fi

          # 4) 再兜底：短 SHA
          if [[ -z "$version" ]]; then
            version="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved build version: $version"

      - name: Detect frontend/embed requirement
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_web="false"
          has_pkg="false"
          need_frontend="false"

          [[ -d web ]] && has_web="true"
          [[ -f web/package.json ]] && has_pkg="true"

          # 代码里显式 embed web/dist 或 web/build
          if git grep -nE 'go:embed .*web/(dist|build)|go:embed .*web' -- '*.go' >/dev/null 2>&1; then
            need_frontend="true"
          fi

          # 只要有前端工程，默认也构建，避免漏掉隐式依赖
          if [[ "$has_pkg" == "true" ]]; then
            need_frontend="true"
          fi

          echo "has_web=$has_web" >> "$GITHUB_OUTPUT"
          echo "has_pkg=$has_pkg" >> "$GITHUB_OUTPUT"
          echo "need_frontend=$need_frontend" >> "$GITHUB_OUTPUT"

          echo "Detected: has_web=$has_web, has_pkg=$has_pkg, need_frontend=$need_frontend"

      - name: Setup Node (when frontend is needed)
        if: steps.detect.outputs.need_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (required for embed)
        if: steps.detect.outputs.need_frontend == 'true'
        working-directory: web
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

          npm run build

      - name: Verify web/dist exists
        if: steps.detect.outputs.need_frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -d web/dist
          test -n "$(ls -A web/dist 2>/dev/null)"
          ls -la web/dist | head -n 50

      - name: Build Go binary (freebsd/amd64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo "Using version: ${VERSION}"
          LDFLAGS="-s -w -X 'github.com/QuantumNous/new-api/common.Version=${VERSION}'"

          echo "Trying: go build ."
          if go build -trimpath -ldflags="${LDFLAGS}" -o dist/new-api_freebsd_amd64 .; then
            echo "Built from project root."
          else
            echo "Root build failed, trying ./cmd/new-api ..."
            go build -trimpath -ldflags="${LDFLAGS}" -o dist/new-api_freebsd_amd64 ./cmd/new-api
            echo "Built from ./cmd/new-api."
          fi

          test -f dist/new-api_freebsd_amd64
          file dist/new-api_freebsd_amd64 || true

      - name: Package tar.gz + sha256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf new-api_freebsd_amd64.tar.gz new-api_freebsd_amd64
          sha256sum new-api_freebsd_amd64.tar.gz > new-api_freebsd_amd64.tar.gz.sha256
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api_freebsd_amd64
          path: |
            dist/new-api_freebsd_amd64.tar.gz
            dist/new-api_freebsd_amd64.tar.gz.sha256

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          tag=""

          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Publish GitHub Release (optional)
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: new-api FreeBSD amd64 ${{ steps.rel.outputs.tag }}
          body: |
            Automated FreeBSD build.
            - Binary: `new-api_freebsd_amd64.tar.gz`
            - Checksum: `new-api_freebsd_amd64.tar.gz.sha256`
          files: |
            dist/new-api_freebsd_amd64.tar.gz
            dist/new-api_freebsd_amd64.tar.gz.sha256
