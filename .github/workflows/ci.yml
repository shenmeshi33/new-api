name: ci

on:
  push:
    branches: [main, alpha]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [main, alpha]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      run_mode:
        description: "CI mode"
        required: true
        default: changed-only
        type: choice
        options:
          - changed-only
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'common/**'
              - 'controller/**'
              - 'middleware/**'
              - 'model/**'
              - 'relay/**'
              - 'router/**'
              - 'service/**'

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    needs: changes
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full')
      || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build web
        working-directory: web
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Verify dist
        run: |
          test -d web/dist
          test -n "$(ls -A web/dist 2>/dev/null)"
          ls -la web/dist | head -n 50

  go-build:
    name: go-build
    runs-on: ubuntu-latest
    needs: changes
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full')
      || needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      # 关键：即使只改 Go，也在本 job 里构建 web/dist，避免 go:embed 报错
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web for go:embed
        working-directory: web
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Verify web/dist exists
        run: |
          test -d web/dist
          test -n "$(ls -A web/dist 2>/dev/null)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go build
        run: go build -v ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Build freebsd binary (smoke artifact)
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/new-api_freebsd_amd64 .
          file dist/new-api_freebsd_amd64 || true

      - name: Upload freebsd smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-smoke-binary
          path: dist/new-api_freebsd_amd64

  freebsd-smoke:
    name: freebsd-smoke
    runs-on: ubuntu-latest
    needs: go-build
    if: needs.go-build.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freebsd-smoke-binary
          path: dist

      - name: Inspect binary
        run: |
          ls -lh dist
          file dist/new-api_freebsd_amd64 || true
          # 这里只做静态检查（Ubuntu 不能直接运行 FreeBSD 二进制）
