name: Release (FreeBSD)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - 'v*'
      - '!v*-alpha*'

jobs:
  freebsd:
    name: FreeBSD Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Determine Version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build Backend (FreeBSD amd64)
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-freebsd-amd64-$VERSION

      - name: Generate checksums
        run: sha256sum new-api-freebsd-amd64-* > checksums-freebsd.txt

      - name: Upload FreeBSD artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64-${{ env.VERSION }}
          path: |
            new-api-freebsd-amd64-*
            checksums-freebsd.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            new-api-freebsd-amd64-*
            checksums-freebsd.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
